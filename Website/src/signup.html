<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Solaria</title>

    <link
        rel="stylesheet"
        href="./signup.css"
    >

</head>


<body>


    <!-- =========================================
         SOLARIA SIGN UP
    ========================================== -->


    <header class="topbar">

        <div class="logo">
            SOLARIA
        </div>


        <nav class="navigation">

            <a href="./index.html">
                Home
            </a>

            <a href="./signin.html">
                Sign In
            </a>

            <a
                href="./signup.html"
                class="current"
            >
                Sign Up
            </a>

            <a href="./download.html">
                Download
            </a>

        </nav>

    </header>


    <main class="auth-page">


        <section class="auth-section">

            <div class="auth-window">


                <div class="window-titlebar">

                    <span>
                        Create a Solaria Account
                    </span>

                </div>


                <div class="auth-content">


                    <div class="auth-logo">
                        SOLARIA
                    </div>


                    <h1>
                        Create Account
                    </h1>


                    <p class="auth-subtitle">
                        Join Solaria and start exploring.
                    </p>


                    <form
                        class="auth-form"
                        id="signUpForm"
                    >


                        <div class="form-group">

                            <label for="username">
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                minlength="3"
                                maxlength="20"
                                autocomplete="username"
                                required
                            >

                            <small>
                                3–20 letters, numbers, or underscores.
                            </small>

                        </div>


                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                minlength="8"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="button primary"
                        >
                            CREATE ACCOUNT
                        </button>


                        <p
                            class="form-message"
                            id="signUpMessage"
                            aria-live="polite"
                        ></p>

                    </form>


                    <div class="auth-divider">
                        <span>OR</span>
                    </div>


                    <button
                        type="button"
                        class="button google-button"
                        id="googleSignUpButton"
                    >
                        SIGN UP WITH GOOGLE
                    </button>


                    <p class="account-link">

                        Already have a Solaria account?

                        <a href="./signin.html">
                            Sign in
                        </a>

                    </p>


                </div>

            </div>

        </section>


    </main>


    <footer class="footer">

        <div class="footer-logo">
            SOLARIA
        </div>


        <div class="footer-links">

            <a href="./index.html">
                Home
            </a>

            <a href="./signin.html">
                Sign In
            </a>

            <a href="./signup.html">
                Sign Up
            </a>

            <a href="./download.html">
                Download
            </a>

        </div>


        <p>
            © 2026 Solaria
        </p>

    </footer>


    <script src="./script.js"></script>

</body>

</html>
