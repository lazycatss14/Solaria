<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Game Details - Solaria</title>

    <link
        rel="stylesheet"
        href="../css/game-details.css"
    >

</head>

<body>

    <div class="details-page">


        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="details-header">

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                â† Back
            </button>

            <div class="header-title">

                <h1>SOLARIA</h1>

                <span>GAME DETAILS</span>

            </div>

            <div class="header-spacer"></div>

        </header>


        <!-- =========================================
             MAIN
        ========================================== -->

        <main class="details-content">


            <!-- =====================================
                 HERO
            ====================================== -->

            <section class="game-hero">

                <div class="hero-thumbnail">

                    <div class="hero-sky"></div>

                    <div class="hero-sun"></div>

                    <div class="hero-mountains"></div>

                    <div class="hero-baseplate">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                    <div class="hero-ball"></div>

                </div>


                <div class="hero-info">

                    <span class="game-status">
                        ONLINE
                    </span>

                    <h2 id="gameName">
                        Test Baseplate
                    </h2>

                    <p
                        id="gameCreator"
                        class="creator"
                    >
                        Created by Solaria
                    </p>

                    <p
                        id="gameDescription"
                        class="hero-description"
                    >
                        Test the Solaria game environment
                        on a simple baseplate.
                    </p>


                    <button
                        id="playGameButton"
                        class="play-button"
                        type="button"
                    >
                        â–¶ PLAY
                    </button>

                </div>

            </section>


            <!-- =====================================
                 STATS
            ====================================== -->

            <section class="stats-section">

                <div class="stat">

                    <span class="stat-label">
                        PLAYERS
                    </span>

                    <strong id="playerCount">
                        0
                    </strong>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        SERVERS
                    </span>

                    <strong id="serverCount">
                        2
                    </strong>

                </div>


                <div class="stat">

                    <span class="stat-label">
                        STATUS
                    </span>

                    <strong>
                        ONLINE
                    </strong>

                </div>

            </section>


            <!-- =====================================
                 DESCRIPTION
            ====================================== -->

            <section class="information-section">

                <div class="section-title">
                    ABOUT THIS GAME
                </div>

                <div class="information-card">

                    <p id="descriptionText">
                        Test the Solaria game environment
                        on a simple baseplate.
                    </p>

                </div>

            </section>


            <!-- =====================================
                 SERVERS
            ====================================== -->

            <section class="servers-section">

                <div class="section-title">
                    SERVERS
                </div>


                <div class="server-list">


                    <article class="server-card">

                        <div>

                            <strong>
                                Server 1
                            </strong>

                            <span>
                                0 / 20 players
                            </span>

                        </div>


                        <button
                            class="join-button"
                            type="button"
                            data-server="1"
                        >
                            JOIN
                        </button>

                    </article>


                    <article class="server-card">

                        <div>

                            <strong>
                                Server 2
                            </strong>

                            <span>
                                0 / 20 players
                            </span>

                        </div>


                        <button
                            class="join-button"
                            type="button"
                            data-server="2"
                        >
                            JOIN
                        </button>

                    </article>


                </div>

            </section>


        </main>

    </div>


    <script src="../js/game-details.js"></script>

<script src="../js/solaria-game-launcher.js"></script>
</body>

</html>
