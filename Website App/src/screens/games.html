<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solaria Games</title>

    <link
        rel="stylesheet"
        href="../css/games.css"
    >
</head>

<body>

    <div class="games-page">

        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="games-header">

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                â† Back
            </button>

            <div class="header-title">
                <h1>SOLARIA</h1>
                <span>GAMES</span>
            </div>

            <div class="header-spacer"></div>

        </header>


        <!-- =========================================
             MAIN
        ========================================== -->

        <main class="games-content">

            <section class="games-section">

                <div class="section-heading">

                    <div>
                        <span class="section-label">
                            SOLARIA
                        </span>

                        <h2>
                            Games
                        </h2>
                    </div>

                </div>


                <!-- =====================================
                     GAME CARD
                ====================================== -->

                <article class="game-card">

                    <!-- THUMBNAIL -->

                    <div class="game-thumbnail">

                        <div class="sky"></div>

                        <div class="sun"></div>

                        <div class="mountains"></div>

                        <div class="baseplate">

                            <div class="grid grid-one"></div>
                            <div class="grid grid-two"></div>
                            <div class="grid grid-three"></div>
                            <div class="grid grid-four"></div>
                            <div class="grid grid-five"></div>

                        </div>

                        <div class="preview-ball"></div>

                    </div>


                    <!-- GAME INFORMATION -->

                    <div class="game-body">

                        <div class="game-title-line">

                            <div>

                                <h3>
                                    Test Baseplate
                                </h3>

                                <p class="creator">
                                    Created by Solaria
                                </p>

                            </div>

                            <span class="online">
                                ONLINE
                            </span>

                        </div>


                        <p class="description">
                            Test the Solaria game environment
                            on a simple baseplate.
                        </p>


                        <div class="game-stats">

                            <span>
                                ðŸ‘¤ 0 Players
                            </span>

                            <span>
                                ðŸŒŽ 2 Servers
                            </span>

                        </div>


                        <div class="game-buttons">

                            <button
                                id="playTestGame"
                                class="play-button"
                                type="button"
                            >
                                â–¶ PLAY
                            </button>

                            <button
                                id="detailsTestGame"
                                class="details-button"
                                type="button"
                            >
                                GAME DETAILS
                            </button>

                        </div>

                    </div>

                </article>


                <!-- =====================================
                     FUTURE GAMES
                ====================================== -->

                <div class="coming-soon">

                    <div class="coming-soon-icon">
                        +
                    </div>

                    <div>

                        <h3>
                            More games coming soon
                        </h3>

                        <p>
                            New Solaria experiences will
                            appear here.
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <script src="../js/games.js"></script>

<script src="../js/solaria-game-launcher.js"></script>
</body>

</html>
