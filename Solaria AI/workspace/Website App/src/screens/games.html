<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solaria Games</title>

    <link
        rel="stylesheet"
        href="../css/games.css"
    >

</head>


<body>

    <div class="games-page">


        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header class="games-header">

            <button
                id="backButton"
                class="back-button"
                type="button"
            >
                ← Back
            </button>


            <h1>
                SOLARIA GAMES
            </h1>


            <div class="header-spacer"></div>

        </header>


        <!-- =====================================================
             MAIN CONTENT
             ===================================================== -->

        <main class="games-content">


            <!-- =================================================
                 GAMES LIST
                 ================================================= -->

            <section class="games-list-section">


                <div class="section-header">

                    <span>
                        GAMES
                    </span>

                </div>


                <div class="games-list">


                    <!-- =============================================
                         TEST BASEPLATE
                         ============================================= -->

                    <article
                        class="game-card"
                        data-game="test"
                        tabindex="0"
                        role="button"
                        aria-label="Open Test Baseplate game"
                    >


                        <!-- GAME IMAGE -->

                        <div class="game-thumbnail">

                            <div class="baseplate-preview">

                                <div class="baseplate-sky"></div>

                                <div class="baseplate-ground">

                                    <div class="grid-line horizontal one"></div>
                                    <div class="grid-line horizontal two"></div>
                                    <div class="grid-line horizontal three"></div>

                                    <div class="grid-line vertical one"></div>
                                    <div class="grid-line vertical two"></div>
                                    <div class="grid-line vertical three"></div>

                                </div>


                                <div class="game-ball"></div>

                            </div>

                        </div>


                        <!-- GAME INFORMATION -->

                        <div class="game-info">


                            <div class="game-title-row">

                                <h2>
                                    Test Baseplate
                                </h2>

                                <span class="online-label">
                                    ONLINE
                                </span>

                            </div>


                            <p class="game-description">

                                Test the Solaria game engine.

                            </p>


                            <div class="game-information">

                                <span>
                                    Players: 0
                                </span>

                                <span>
                                    Created by Solaria
                                </span>

                            </div>


                            <div class="game-actions">

                                <button
                                    id="playTestGame"
                                    class="play-button"
                                    type="button"
                                >
                                    PLAY
                                </button>


                                <button
                                    id="detailsTestGame"
                                    class="details-button"
                                    type="button"
                                >
                                    GAME DETAILS
                                </button>

                            </div>


                        </div>

                    </article>


                </div>

            </section>


        </main>


    </div>


    <script src="../js/games.js"></script>

</body>

</html>
